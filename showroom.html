<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Showroom — Atelier Noir</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
  <style>
    :root{--bg:#070606;--ivory:#efeae3;--muted:#9b9b9b;--accent:#c9b37a;--max-width:1300px}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#0b0a0a);color:var(--ivory);font-family:Inter,system-ui,Arial}
    .wrap{min-height:100vh;display:flex;flex-direction:column}
    header{position:fixed;left:0;right:0;top:0;height:78px;display:flex;align-items:center;padding:12px 20px;backdrop-filter:blur(6px);z-index:50}
    .header-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:center;justify-content:space-between;width:100%}
    .brand{display:flex;gap:12px;align-items:center}
    .viewer{margin-top:92px;flex:1;display:grid;grid-template-columns:1fr 360px;gap:24px;padding:24px;max-width:var(--max-width);margin-left:auto;margin-right:auto}
    .canvas-wrap{border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.03);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
    #showroomCanvas{width:100%;height:720px;display:block}
    .side{position:relative}
    .panel{background:linear-gradient(180deg,#0a0a0a,#0c0c0c);padding:18px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);height:100%}
    .panel h3{margin:0 0 8px 0;font-family:'Playfair Display';font-size:20px}
    .list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
    .list button{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:10px;border-radius:10px;color:var(--ivory);text-align:left;cursor:pointer}
    .controls{display:flex;flex-direction:column;gap:10px;margin-top:18px}
    .control{display:flex;gap:8px;align-items:center}
    .control input[type=range]{width:160px}
    .tooltip{color:var(--muted);font-size:13px;margin-top:8px}
    footer{padding:28px;text-align:center;color:var(--muted)}
    @media(max-width:980px){.viewer{grid-template-columns:1fr;}.canvas-wrap #showroomCanvas{height:520px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-inner">
        <a class="brand" href="home.html" style="text-decoration:none;color:var(--ivory)"><div style="width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8f7a44);display:grid;place-items:center;font-family:'Playfair Display'">AN</div><div style="font-family:'Playfair Display'">Atelier Noir</div></a>
        <nav style="display:flex;gap:14px;align-items:center"><a href="home.html" style="color:var(--muted);text-decoration:none">Home</a><a href="collections.html" style="color:var(--muted);text-decoration:none">Collections</a><a href="bed-closet.html" style="color:var(--muted);text-decoration:none">Bed &amp; Closet</a></nav>
      </div>
    </header>

    <main class="viewer" role="main">
      <div class="canvas-wrap">
        <canvas id="showroomCanvas" aria-label="3D showroom"></canvas>
      </div>

      <aside class="side">
        <div class="panel">
          <h3>3D Showroom</h3>
          <div class="tooltip">Explore the curated room. Click a product to focus. Use scroll to zoom. Toggle sound for subtle cinematic interaction audio.</div>

          <div class="list" id="productList">
            <!-- Injected by JS -->
          </div>

          <div class="controls">
            <div class="control"><label style="min-width:80px">Auto rotate</label><input id="autoRotate" type="checkbox" /></div>
            <div class="control"><label style="min-width:80px">Exposure</label><input id="exposure" type="range" min="0.4" max="1.8" step="0.01" value="1" /></div>
            <div class="control"><label style="min-width:80px">Sound</label><button id="soundBtn">ON</button></div>
            <div class="control"><label style="min-width:80px">Zoom</label><input id="zoomRange" type="range" min="1" max="3" step="0.01" value="1.35" /></div>
          </div>
        </div>
      </aside>
    </main>

    <footer>Atelier Noir — immersive showroom · Crafted Interiors</footer>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.156.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.156.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.156.0/examples/jsm/controls/OrbitControls.js';
    import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.156.0/examples/jsm/environments/RoomEnvironment.js';

    const canvas = document.getElementById('showroomCanvas');
    const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40,1,0.1,200);
    camera.position.set(0,1.6,4.5);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = new RoomEnvironment();
    const envMap = pmrem.fromScene(env).texture;
    scene.environment = envMap;

    // Cinematic lights
    const key = new THREE.DirectionalLight(0xfff6ec,1.1); key.position.set(3,6,2); scene.add(key);
    const fill = new THREE.HemisphereLight(0x8b7a66, 0x050505, 0.5); scene.add(fill);

    // Floor
    const floorMat = new THREE.MeshStandardMaterial({color:0x070606,roughness:0.18,metalness:0.05,envMap:envMap});
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30,30), floorMat);
    floor.rotation.x = -Math.PI/2; floor.position.y = -0.02; floor.receiveShadow=true; scene.add(floor);

    // Gallery walls (subtle)
    const wallMat = new THREE.MeshStandardMaterial({color:0x0d0c0c,roughness:0.9});
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30,8), wallMat); backWall.position.set(0,3.8,-10); scene.add(backWall);

    // Products container
    const showroom = new THREE.Group(); scene.add(showroom);

    const loader = new GLTFLoader();
    const modelList = [
      {id:'sofa',name:'Canto Sofa',url:'./models/showroom_sofa.glb',pos:[-1.6,0,0]},
      {id:'table',name:'Noir Coffee Table',url:'./models/showroom_table.glb',pos:[0.8,0.0,0.4]},
      {id:'arm',name:'Aurea Chair',url:'./models/showroom_chair.glb',pos:[2.0,0,-0.4]},
      {id:'bed',name:'Sol Bed',url:'./models/showroom_bed.glb',pos:[-2.6,0,-1.2]}
    ];

    const products = {};
    let loaded = 0;
    function loadModels(){
      modelList.forEach((m,idx)=>{
        loader.load(m.url, gltf=>{
          const root = gltf.scene||gltf.scenes[0];
          // scale to fit
          const box = new THREE.Box3().setFromObject(root);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x,size.y,size.z);
          const s = 0.9 / maxDim;
          root.scale.setScalar(s);
          const box2 = new THREE.Box3().setFromObject(root);
          const center = box2.getCenter(new THREE.Vector3());
          root.position.sub(center);
          root.position.set(m.pos[0],0.01,m.pos[2]);
          root.traverse(n=>{ if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; }});
          showroom.add(root);
          products[m.id] = {root,meta:m};
          loaded++;
          updateList();
        }, xhr=>{}, err=>{
          // graceful: create a stylized box as placeholder
          const g = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.45,0.6), new THREE.MeshStandardMaterial({color:0x111010,roughness:0.45,metalness:0.05,envMap:envMap}));
          g.position.set(m.pos[0],0.22,m.pos[2]); showroom.add(g); products[m.id]={root:g,meta:m}; loaded++; updateList();
        });
      });
    }

    // UI product list
    const listNode = document.getElementById('productList');
    function updateList(){
      listNode.innerHTML='';
      modelList.forEach(m=>{
        const btn = document.createElement('button');
        btn.textContent = m.name; btn.dataset.id = m.id;
        btn.addEventListener('click', ()=>{ focusProduct(m.id); playClick(); });
        listNode.appendChild(btn);
      });
    }

    // Camera controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan=false; controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2.1; controls.minDistance=1.2; controls.maxDistance=12;

    // Auto-rotate
    let autoRotate=false;
    document.getElementById('autoRotate').addEventListener('change', (e)=>{ autoRotate = e.target.checked; playClick(); });

    // Exposure
    const exposure = document.getElementById('exposure'); exposure.addEventListener('input',(e)=>{ renderer.toneMappingExposure = parseFloat(e.target.value); });

    // Zoom
    const zoomRange = document.getElementById('zoomRange'); zoomRange.addEventListener('input',(e)=>{ const v=parseFloat(e.target.value); camera.position.set(0,1.6,4.5/v); playClick(); });

    // Sound
    let audioCtx,masterGain,soundOn=true;
    document.getElementById('soundBtn').addEventListener('click', async ()=>{ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); masterGain = audioCtx.createGain(); masterGain.gain.value = 0.5; masterGain.connect(audioCtx.destination); }
      soundOn = !soundOn; document.getElementById('soundBtn').textContent = soundOn? 'ON':'OFF'; if(soundOn) playClick(); });

    function playClick(){ if(!soundOn || !audioCtx) return; const t = audioCtx.currentTime; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(720,t); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.08,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25); o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.26); }

    function playZoom(){ if(!soundOn || !audioCtx) return; const t=audioCtx.currentTime; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(220,t); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.12,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5); o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.5); }

    zoomRange.addEventListener('input', playZoom);

    // Focus product
    function focusProduct(id){ const p = products[id]; if(!p) return; const box = new THREE.Box3().setFromObject(p.root); const c = box.getCenter(new THREE.Vector3()); // move camera to focus
      gsap.to(camera.position, { x: c.x + 0.0, y: Math.max(1.1, c.y + 1.0), z: c.z + 2.6, duration:1.2, ease:'power3.inOut' }); gsap.to(controls.target, { x:c.x, y:c.y, z:c.z, duration:1.2, ease:'power3.inOut' }); }

    // Resize
    function resize(){ const r = canvas.getBoundingClientRect(); renderer.setSize(Math.max(300,Math.floor(r.width)), Math.max(200,Math.floor(r.height)), false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
    new ResizeObserver(resize).observe(canvas);

    // Animate
    let last = performance.now(); function loop(now){ const dt=(now-last)/1000; last=now; if(autoRotate) showroom.rotation.y += dt*0.08; controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop); }

    // Simple bloom-like reflection by environment intensity
    renderer.toneMappingExposure = 1.0;

    // Initialize
    loadModels(); requestAnimationFrame(loop);

    // Start audio context on first interaction (browser policy)
    window.addEventListener('pointerdown', async ()=>{ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); masterGain = audioCtx.createGain(); masterGain.gain.value = 0.5; masterGain.connect(audioCtx.destination); } if(audioCtx.state === 'suspended') await audioCtx.resume(); }, {once:true});

  </script>
</body>
</html>
